<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Legend of Elements Wiki</title>
    <meta name="description" content="Legend of Elements Wiki — community encyclopedia for the game." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Legend of Elements Wiki" />
    <meta property="og:description" content="Legend of Elements Wiki — community encyclopedia for the game." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Legend of Elements Wiki" />
    <meta name="twitter:description" content="Legend of Elements Wiki — community encyclopedia for the game." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var key = "vite-ui-theme";
          var t = localStorage.getItem(key) || "dark";
          if (t === "system") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.add(t === "light" ? "light" : "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html, body { background: #0b1220; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
