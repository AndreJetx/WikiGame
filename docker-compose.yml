services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: wikigame
      POSTGRES_PASSWORD: wikigame
      POSTGRES_DB: wikigame
    volumes:
      - wikigame_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikigame -d wikigame"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  wikigame_pg:
